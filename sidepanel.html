<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gemini Page Translator</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <h1>Page Translator</h1>
    <button id="settingsBtn" title="Settings">⚙</button>
  </header>

  <main>
    <div id="pageInfo" class="page-info"></div>

    <button id="translateBtn">Translate this page</button>

    <div id="status" class="status" hidden></div>

    <div id="noKeyNotice" class="notice" hidden>
      No Gemini API key set yet.
      <a href="#" id="openOptionsLink">Open settings</a> to add one.
    </div>

    <article id="output" class="output"></article>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
