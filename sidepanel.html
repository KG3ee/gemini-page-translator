<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gemini Page Translator</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <h1>Page Translator</h1>
    <button id="settingsBtn" title="Settings">⚙</button>
  </header>

  <main>
    <div id="pageInfo" class="page-info"></div>

    <button id="translateInPlaceBtn">Translate this page in place</button>
    <p class="hint">Right-click any page → <b>Translate to Burmese</b>, or press <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd>.</p>
    <button id="translateBtn" class="secondary">Translate in this panel instead</button>

    <div id="status" class="status" hidden></div>

    <div id="noKeyNotice" class="notice" hidden>
      No API key set yet.
      <a href="#" id="openOptionsLink">Open settings</a> to add one.
    </div>

    <article id="output" class="output"></article>
  </main>

  <script src="prompt.js"></script>
  <script src="openrouter.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
